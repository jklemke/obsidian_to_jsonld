<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8"/>
    <meta name="ROBOTS" content="ALL">
    <meta name="Copyright" content="Vernacular Cloud LLC">
    <meta name="description" content="{{ description | e }}"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">    
    <title>{{ title }} - Vernacular Cloud</title>
    <!-- D-006: the permanent concept IRI is canonical; this page is one version of it -->
    <link rel="canonical" href="{{ concept_iri }}">
    <meta property="og:site_name" content="Vernacular Cloud">
    <meta property="og:type" content="article">
    <meta property="og:title" content="{{ title | e }}">
    <meta property="og:description" content="{{ description | e }}">
    <meta property="og:url" content="{{ concept_iri }}">
    <link rel="stylesheet" href="/css/prj/core.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Otomanopee One">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Palanquin Dark">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Palanquin">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Sumana">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source Code Pro">
    <link rel="stylesheet" href="https://fontlibrary.org//face/go-mono" media="screen" type="text/css"/>

    <script type="application/ld+json">
      {{ json_ld | indent(6) | safe }}
    </script>

  </head>
  <body>
    
    <header>
      <h1>Vernacular Cloud</h1>
      <nav>
        <ul class="navlist">
          <li><a href="/{{ version }}/">Home</a></li>
          <li><a href="/about/">About</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <h1>concept: {{ title }}</h1>
      <p>concept: <a href="{{ concept_iri }}">{{ concept_iri }}</a><br>
        this version: <a href="{{ page_url }}">{{ page_url }}</a></p>
      {{ html_main_content | safe }}
    </main>

    <aside>
      <h1>Notes</h1>
      {{ html_aside_content | safe }}
    </aside>

    <footer>
      <small>version {{ version }} · <a href="/latest/{{ uuid }}/">latest version</a> · Copyright &copy; <time datetime="2026">2026 </time>Vernacular Cloud LLC <a href="mailto:victor.badinage@vernacular.cloud">victor.badinage@vernacular.cloud</a></small>
    </footer>

  </body>
</html>
