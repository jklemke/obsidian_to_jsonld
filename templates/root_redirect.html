<!DOCTYPE html>
<!-- {{ marker }}: redirect to {{ target }}. Do not edit by hand. -->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>{{ title }} - Vernacular Cloud</title>
    <meta http-equiv="refresh" content="0; url={{ target }}">
    <link rel="canonical" href="{{ domain }}{{ target }}">
    <script>location.replace("{{ target }}");</script>
  </head>
  <body>
    <p>{{ title }}: <a href="{{ target }}">{{ domain }}{{ target }}</a></p>
  </body>
</html>
